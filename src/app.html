<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/logo.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Manrope:wght@500;600;800&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="%sveltekit.assets%/normalize.css" />
		<link rel="stylesheet" href="%sveltekit.assets%/prism.css" />
		<meta name="viewport" content="width=device-width" />
		%sveltekit.head%
		<script>
			// check for theme preference before page loads
			if (!('theme' in localStorage)) {
				localStorage.theme = window.matchMedia('(prefers-color-scheme: light)').matches
					? 'light'
					: 'dark';
			}
			document.documentElement.setAttribute('data-theme', localStorage.theme);
		</script>
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-zinc-950 text-zinc-300 overflow-hidden">
		<noscript class="m-6 rounded-xl shadow-xl bg-zinc-700 block p-4">
			<h2 class="font-display text-white text-xl font-semibold">Hey there!</h2>
			<p>
				You don't appear to have JavaScript enabled. That's a bummer! This site requires it function
				normally :\
			</p>
		</noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
